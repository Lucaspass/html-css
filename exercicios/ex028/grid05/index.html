<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .container{
            display: grid;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .caixa1{
            display: grid;
            place-items: center;
            background-color: bisque;       
            grid-row: 1 / 2;
            grid-column: 1 / span 4;

        }
        
        .caixa2{
            background-color: blue;
            grid-row-start: 2;
            grid-row-end: span 2;
            grid-column-start: 1;
            grid-column-end: span 2;
        }
        
        .caixa3{
            background-color: red;
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start:3 ;
            grid-column-end: 5;
        }
        
    </style>
</head>
<body>
    <header> <h1> Aprendendo Grid Layout com áreas</h1></header>

    <main class="container">
        <div class="caixa1">Caixa 01</div>
        <div class="caixa2">Caixa 02</div>
        <div class="caixa3">Caixa 03</div>
    </main>
</body>
</html>
