<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="" method="post">

        <p>
            <label for="iestado"> Estado</label>
            <select name="estado" id="iestado">
            
                     <option value="" selected> --- Selecione um estado ---</option>
                    <optgroup label="Regiao Nordeste">
                        <option value="BA"> Bahia</option>
                        <option value="CE"> Ceará</option>
                        <option value="PI"> Piaui</option>
                    </optgroup>
            
            
                <optgroup label="Regiao Sudeste">
                    <option value="SP"> São Paulo</option>
                    <option value="RJ"> Rio de Janeiro</option>
                    <option value="MG"> Minas Gerais</option>
                </optgroup>
            </select>
        </p>

        <p>
            <label for="iprof"> Profissão</label>
            <input type="text" name="prof" id="iprof" list="ilistaprof">
            <datalist id="ilistaprof">
                <option value="Enf"> Enfermeiro</option>
                <option value="Dev"> Desenvolvedor</option>
                <option value="Psi"> Psicólogo</option>
                <option value="Adv"> Advogado</option>
            </datalist>
        </p>

        <p>
            <label for="imensagem"> Mensagem</label> <br>
            <textarea name="mensagem" id="imensagem" cols="30" rows="10"></textarea>    
        </p>  

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
