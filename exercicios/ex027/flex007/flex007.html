<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightgoldenrodyellow;
            display: flex;
        }

        div.item{
            background-color: lightsteelblue;
            padding: 10px;
            border: 1px solid black;
            text-align: center;
        }

        div#l1{
            order: 10;

        }
        
        div#l2{
            order: 7;
        }

        div#l3{
            order: 9;
        }  
        
        div#l4{
            order: -2;

        }
        
        div#l5{
            order: -4;
        }

        div#l6{
            order: 0;
        }




    </style>
</head>
<body>
    <h1>Aprendendo Flex Box</h1>

    <div class="conteiner">

        <div class="item"id="l1">A</div>        
        <div class="item"id="l2"> B</div>        
        <div class="item"id="l3"> C</div>
        <div class="item"id="l4"> D</div>
        <div class="item"id="l5"> E</div>
        <div class="item"id="l6"> F</div>





    </div>
</body>
</html>
