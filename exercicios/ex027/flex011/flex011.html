<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightgoldenrodyellow;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: lightsteelblue;
            flex-basis: 200px;
            border: 1px solid black;
            text-align: center;
        }

        div#cxA{
            flex-grow: 1;
            flex-shrink: 1;

        }
        
        div#cxB{
            flex-grow: 2;
            flex-shrink: 2;
        }
         
        div#cxC{
            flex-grow: 1;
            flex-shrink: 1;
        }

        

    </style>
</head>
<body>
    <h1>Aprendendo Flex Box</h1>

    <div class="conteiner">

        <div class="item" id="cxA"> A</div>        
        <div class="item" id="cxB"> B</div>        
        <div class="item" id="cxC"> C</div>
        





    </div>
</body>
</html>
