<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightgoldenrodyellow;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: lightsteelblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 100px;
            flex-grow: 1;
            flex-shrink: 1;

        }
    </style>
</head>
<body>
    <h1>Aprendendo Flex Box</h1>

    <div class="conteiner">

        <div class="item"> A</div>        
        <div class="item"> Luqueta Tiqueta</div>        
        <div class="item"> C</div>
        <div class="item"> D</div>
        <div class="item"> ETiqueta Lucas Luqueta</div>
        <div class="item"> F</div>





    </div>
</body>
</html>
