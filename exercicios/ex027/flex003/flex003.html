<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightgoldenrodyellow;
            display: flex;
            height: 100px;
            flex-direction: column;
            flex-wrap: wrap;
            
        }

        div.item{
            background-color: lightsteelblue;
            flex: auto;
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Aprendendo Flex Box</h1>

    <div class="conteiner">

        <div class="item"> Exemplo pratico usados A</div>        
        <div class="item"> Exemplo pratico usados B</div>        
        <div class="item"> Exemplo pratico usados C</div>
        <div class="item"> Exemplo pratico usados D</div>
        <div class="item"> Exemplo pratico usados E</div>
        <div class="item"> Exemplo pratico usados F</div>





    </div>
</body>
</html>
